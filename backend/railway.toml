# Configuración de Railway para el backend.
# En el servicio de Railway hay que fijar "Root Directory" = backend para que use este archivo
# y el Dockerfile con el contexto correcto.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/salud"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
