[project]
name = "cotizador-visual-backend"
version = "0.1.0"
description = "Backend del Cotizador visual de mobiliario (Minimal 4.0)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "supabase>=2.10",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "weasyprint>=62",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "PyJWT[crypto]>=2.9",
    "openai>=1.50",
    "pillow>=10.4",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
