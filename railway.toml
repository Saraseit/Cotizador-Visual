# Configuración de Railway para el backend, en la raíz del repo para que no haga falta
# cambiar el "Root Directory" del servicio: el contexto de build es el repo completo y el
# Dockerfile copia desde backend/.
[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
watchPatterns = ["backend/**", "railway.toml"]

[deploy]
healthcheckPath = "/api/salud"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
