<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProVista</title>
    <meta name="color-scheme" content="light dark" />
    <!-- Aplica el tema guardado (o el del sistema) antes de pintar, para que no haya un parpadeo claro. -->
    <script>
      try {
        var guardado = localStorage.getItem('provista-tema')
        var oscuro =
          guardado === 'oscuro' ||
          ((guardado === null || guardado === 'sistema') && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', oscuro)
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
