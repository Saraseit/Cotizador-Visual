name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Dependencias de sistema de WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - name: Instalar el backend
        run: pip install -e "./backend[dev]"
      - name: Pruebas
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # El build no necesita valores reales; sólo que existan para el bundle.
          VITE_SUPABASE_URL: https://ejemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: ejemplo
          VITE_API_URL: https://ejemplo.up.railway.app

  imagen:
    name: Backend (imagen Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen igual que Railway
        run: docker build -f backend/Dockerfile -t cotizador-backend .
      - name: Arranca y renderiza un PDF (sin Supabase)
        run: |
          docker run --rm cotizador-backend python -c "from app.servicios.render_pdf import html_a_pdf; pdf = html_a_pdf('<p style=\"font-family: IBM Plex Sans\">Prueba</p>'); assert pdf.startswith(b'%PDF-'); print('PDF OK', len(pdf), 'bytes')"
